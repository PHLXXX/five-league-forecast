<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>喷火龙五大联赛分析</title>
    <link rel="stylesheet" href="./styles.css?v=1.2.2" />
    <script src="./app.js?v=1.2.2" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 9l5 3.6-1.9 5.9h-6.2L11 12.6z" fill="currentColor"/><path d="M16 3v6M27.5 12.6l-6.5 0M23.7 26.5l-4.6-8M8.3 26.5l4.6-8M4.5 12.6l6.5 0" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
        <div class="brand-text">
          <strong>喷火龙五大联赛分析</strong>
          <span>Dixon-Coles 评级 · 赔率融合 · 逐场回测</span>
        </div>
      </div>
      <nav id="leagueTabs" class="league-tabs" aria-label="选择联赛"></nav>
      <div class="top-actions">
        <select id="seasonSelect" class="pill-select" aria-label="赛季"></select>
        <span id="connectionState" class="status-dot" title="连接状态"></span>
        <button id="refreshBtn" class="icon-btn" title="刷新数据" aria-label="刷新数据">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="view-nav" role="tablist">
      <button class="view-tab active" data-view="matches">赛程预测</button>
      <button class="view-tab" data-view="standings">积分榜</button>
      <button class="view-tab" data-view="backtest">模型回测</button>
      <button class="view-tab" data-view="history">推荐命中率</button>
    </nav>

    <main>
      <section id="matchesView" class="view active">
        <div class="hit-strip" id="hitRateStrip"></div>
        <div class="matches-layout">
          <aside class="match-rail">
            <div class="rail-tools">
              <div class="segmented" id="statusFilter">
                <button data-status="upcoming" class="active">未开赛</button>
                <button data-status="finished">已完场</button>
                <button data-status="all">全部</button>
              </div>
              <label class="search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input id="matchFilter" type="search" placeholder="搜索球队" autocomplete="off" />
              </label>
            </div>
            <div id="matchList" class="match-list" aria-live="polite"></div>
          </aside>

          <div class="detail" id="detail">
            <div class="empty-detail">选择左侧一场比赛查看预测</div>
          </div>
        </div>
      </section>

      <section id="standingsView" class="view">
        <div class="page">
          <div class="page-head">
            <div><h2 id="standingsTitle">积分榜</h2><p id="standingsMeta" class="muted"></p></div>
          </div>
          <div class="card" id="standingsTable"></div>
        </div>
      </section>

      <section id="backtestView" class="view">
        <div class="page">
          <div class="page-head">
            <div>
              <h2>模型回测</h2>
              <p class="muted" id="backtestMethod">逐场只用开赛前数据重新拟合再预测。</p>
            </div>
            <div class="head-actions">
              <select id="backtestScope" class="pill-select" aria-label="回测范围">
                <option value="league">当前联赛</option>
                <option value="ALL">五大联赛合计</option>
              </select>
              <select id="backtestSeason" class="pill-select" aria-label="回测赛季"></select>
            </div>
          </div>
          <div id="backtestBody"></div>
        </div>
      </section>

      <section id="historyView" class="view">
        <div class="page">
          <div class="page-head">
            <div>
              <h2>推荐命中率统计</h2>
              <p class="muted">每次打开未开赛的比赛都会自动保存当时的推荐（赛前留档）；完场后用真实比分核对。没有赛前留档的比赛不计入命中率。</p>
            </div>
            <div class="head-actions">
              <select id="historyScope" class="pill-select" aria-label="统计范围">
                <option value="league">当前联赛</option>
                <option value="ALL">五大联赛合计</option>
                <option value="worldcup">世界杯留档</option>
              </select>
            </div>
          </div>
          <div id="historyBody"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
